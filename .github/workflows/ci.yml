name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: queueless
          POSTGRES_PASSWORD: queueless
          POSTGRES_DB: queueless_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queueless"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://queueless:queueless@localhost:5432/queueless_test
      DATABASE_URL: postgresql://queueless:queueless@localhost:5432/queueless_test
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
